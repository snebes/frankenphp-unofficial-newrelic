name: Release PIE binaries

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach assets to (e.g. v1.0.0)
        required: true

permissions:
  contents: write

env:
  agent-repo: theophileds/newrelic-php-agent-zts
  agent-ref: zts-support
  extension-name: newrelic

jobs:
  resolve:
    name: Resolve agent commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - id: sha
        run: |
          set -euo pipefail
          sha="$(git ls-remote "https://github.com/${{ env.agent-repo }}.git" "refs/heads/${{ env.agent-ref }}" | cut -f1)"
          test -n "${sha}"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"

  build:
    name: "PHP ${{ matrix.php-version }} ${{ matrix.arch }}"
    needs: resolve
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        php-version: [ '8.2', '8.3', '8.4', '8.5' ]
        arch: [ x86_64, arm64 ]
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout agent source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.agent-repo }}
          ref: ${{ needs.resolve.outputs.sha }}
          path: agent-src

      - name: Build newrelic.so
        run: |
          docker build agent-src \
            -f Dockerfile.zts-build \
            --target package \
            --build-arg PHP_VERSION=${{ matrix.php-version }} \
            --output type=local,dest=out

      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
          EXT: ${{ env.extension-name }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          PHP_VERSION: ${{ matrix.php-version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          readelf -d out/newrelic.so | grep NEEDED

          mkdir staging
          cp out/newrelic.so "staging/${EXT}.so"
          cp agent-src/LICENSE agent-src/THIRD_PARTY_NOTICES.md staging/

          # Asset name format required by PIE's pre-packaged-binary download method.
          asset="php_${EXT}-${TAG}_php${PHP_VERSION}-${ARCH}-linux-glibc-zts.zip"
          (cd staging && zip -9 -r "../${asset}" .)

          gh release upload "${TAG}" "${asset}" --clobber --repo "${{ github.repository }}"
