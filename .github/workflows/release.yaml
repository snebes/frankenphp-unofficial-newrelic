name: Release PIE binaries

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag matching a New Relic agent version (e.g. v12.6.0 or v12.6.0.34)
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yaml
    with:
      agent-version: ${{ github.event.release.tag_name || inputs.tag }}
      asset-version: ${{ github.event.release.tag_name || inputs.tag }}

  publish:
    name: Upload release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download assets
        uses: actions/download-artifact@v4
        with:
          pattern: php_newrelic-*
          merge-multiple: true
          path: dist

      - name: Download build info
        uses: actions/download-artifact@v4
        with:
          pattern: build-info-*
          merge-multiple: true
          path: dist

      - name: Generate checksums
        run: cd dist && sha256sum *.zip > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*.zip

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          ls -l dist
          gh release upload "${TAG}" dist/*.zip dist/build-info.json --clobber --repo "${{ github.repository }}"
