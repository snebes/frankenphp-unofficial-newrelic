name: Release PIE binaries

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag matching a New Relic agent version (e.g. v12.11.0 or v12.11.0.40)
        required: true

permissions:
  contents: write

env:
  agent-repo: theophileds/newrelic-php-agent-zts
  agent-ref: zts-support
  upstream-repo: newrelic/newrelic-php-agent
  artifact-name: newrelic-php-agent-src
  extension-name: newrelic

jobs:
  prepare:
    name: Merge upstream ${{ github.event.release.tag_name || inputs.tag }}
    runs-on: ubuntu-latest
    outputs:
      build-number: ${{ steps.merge.outputs.build-number }}
    steps:
      - name: Checkout agent source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.agent-repo }}
          ref: ${{ env.agent-ref }}
          path: agent-src
          fetch-depth: 0

      - name: Merge upstream tag
        id: merge
        working-directory: agent-src
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${{ env.upstream-repo }}.git"
          # Separate namespace so upstream tags cannot clash with the fork's own tags.
          git fetch --quiet --no-tags upstream '+refs/tags/*:refs/upstream-tags/*'

          # Upstream tags are vMAJOR.MINOR.PATCH.BUILD; accept that exactly, or the
          # three-part version and pick its newest build.
          if git show-ref -q --verify "refs/upstream-tags/${TAG}"; then
            upstream_tag="${TAG}"
          else
            upstream_tag="$(git for-each-ref --sort=-v:refname --format='%(refname:strip=2)' \
              "refs/upstream-tags/${TAG}.*" | head -n1)"
          fi
          if [[ -z "${upstream_tag}" ]]; then
            echo "::error::No ${{ env.upstream-repo }} tag matches ${TAG}"
            exit 1
          fi
          echo "Merging ${{ env.upstream-repo }} ${upstream_tag} into ${{ env.agent-repo }}@$(git rev-parse --short HEAD)"

          if ! git merge --no-edit "refs/upstream-tags/${upstream_tag}"; then
            echo "::error::Merge conflicts merging ${upstream_tag} into ${{ env.agent-ref }}:"
            git diff --name-only --diff-filter=U | sed 's/^/  /'
            exit 1
          fi

          echo "Agent VERSION: $(cat VERSION)"
          echo "build-number=${upstream_tag##*.}" >> "${GITHUB_OUTPUT}"

      - name: Upload merged agent source
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact-name }}
          path: agent-src
          if-no-files-found: error
          retention-days: 2

  build:
    name: "PHP ${{ matrix.php-version }} ${{ matrix.arch }}"
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        php-version: [ '8.2', '8.3', '8.4', '8.5' ]
        arch: [ x86_64, arm64 ]
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download merged agent source
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.artifact-name }}
          path: agent-src

      - name: Build newrelic.so
        run: |
          docker build agent-src \
            -f Dockerfile.zts-build \
            --target package \
            --build-arg PHP_VERSION=${{ matrix.php-version }} \
            --build-arg BUILD_NUMBER=${{ needs.prepare.outputs.build-number }} \
            --output type=local,dest=out

      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
          EXT: ${{ env.extension-name }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          PHP_VERSION: ${{ matrix.php-version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          readelf -d out/newrelic.so | grep NEEDED

          mkdir staging
          cp out/newrelic.so "staging/${EXT}.so"
          cp agent-src/LICENSE agent-src/THIRD_PARTY_NOTICES.md staging/

          # Asset name format required by PIE's pre-packaged-binary download method.
          asset="php_${EXT}-${TAG}_php${PHP_VERSION}-${ARCH}-linux-glibc-zts.zip"
          (cd staging && zip -9 -r "../${asset}" .)

          gh release upload "${TAG}" "${asset}" --clobber --repo "${{ github.repository }}"
