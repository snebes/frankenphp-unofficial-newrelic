name: CI

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      agent-version:
        description: New Relic agent tag to test against
        required: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate composer.json
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: composer validate
        run: composer validate --no-check-publish

  build:
    name: Build
    uses: ./.github/workflows/build.yaml
    with:
      # Newest upstream version known to merge cleanly into the ZTS fork; bump when that changes.
      agent-version: ${{ inputs.agent-version || 'v12.6.0' }}
      asset-version: ci

  gate:
    name: CI gate
    if: always()
    needs: [ validate, build ]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "Job results: ${RESULTS}"
          echo "${RESULTS}" | jq -e 'all(. == "success")' >/dev/null
